allowBuilds:
  '@parcel/watcher': true
  sharp: false
  unrs-resolver: false

# Next's eslint plugin said these should work with eslint 10, despite only officially supporting up to ^9
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: "10"
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"

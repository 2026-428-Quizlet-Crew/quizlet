<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Q++ logo">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a1a6e"/>
            <stop offset="1" stop-color="#7b2ff7"/>
        </linearGradient>
        <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="220" y1="200" x2="460" y2="370">
            <stop offset="0" stop-color="#ffb347"/>
            <stop offset="1" stop-color="#ff5e62"/>
        </linearGradient>
        <filter id="lift" x="-20%" y="-20%" width="150%" height="150%">
            <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.22"/>
        </filter>
        <filter id="cast" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="7"/>
        </filter>
    </defs>

    <g transform="translate(256,256) scale(0.94) translate(-256,-256)">
        <!-- soft cast shadow under the gem -->
        <polygon
                points="496,256 477.73,164.16 425.71,86.29 347.84,34.27 256,16 164.16,34.27 86.29,86.29 34.27,164.16 16,256 34.27,347.84 86.29,425.71 164.16,477.73 256,496 347.84,477.73 425.71,425.71 477.73,347.84"
                fill="#000000" fill-opacity="0.38" filter="url(#cast)" transform="translate(6,10)"/>

        <!-- gem top: regular 16-gon outline, octagonal table. Triangle points and kite tips alternate around it -->
        <polygon
                points="496,256 477.73,164.16 425.71,86.29 347.84,34.27 256,16 164.16,34.27 86.29,86.29 34.27,164.16 16,256 34.27,347.84 86.29,425.71 164.16,477.73 256,496 347.84,477.73 425.71,425.71 477.73,347.84"
                fill="url(#bg)"/>

        <!-- crown, lit from the top-left -->
        <g stroke="none">
            <!-- triangles on the table sides -->
            <polygon points="452,174.83 452,337.17 496,256" fill="#000000" fill-opacity="0.11"/>
            <polygon points="337.17,60 452,174.83 425.71,86.29" fill="#ffffff" fill-opacity="0.06"/>
            <polygon points="174.83,60 337.17,60 256,16" fill="#ffffff" fill-opacity="0.16"/>
            <polygon points="60,174.83 174.83,60 86.29,86.29" fill="#ffffff" fill-opacity="0.20"/>
            <polygon points="60,337.17 60,174.83 16,256" fill="#ffffff" fill-opacity="0.08"/>
            <polygon points="174.83,452 60,337.17 86.29,425.71" fill="#000000" fill-opacity="0.06"/>
            <polygon points="337.17,452 174.83,452 256,496" fill="#000000" fill-opacity="0.19"/>
            <polygon points="452,337.17 337.17,452 425.71,425.71" fill="#000000" fill-opacity="0.24"/>
            <!-- kites at the table corners -->
            <polygon points="452,174.83 496,256 477.73,164.16 425.71,86.29" fill="#000000" fill-opacity="0.05"/>
            <polygon points="337.17,60 425.71,86.29 347.84,34.27 256,16" fill="#ffffff" fill-opacity="0.12"/>
            <polygon points="174.83,60 256,16 164.16,34.27 86.29,86.29" fill="#ffffff" fill-opacity="0.24"/>
            <polygon points="60,174.83 86.29,86.29 34.27,164.16 16,256" fill="#ffffff" fill-opacity="0.18"/>
            <polygon points="60,337.17 16,256 34.27,347.84 86.29,425.71" fill="#ffffff" fill-opacity="0.03"/>
            <polygon points="174.83,452 86.29,425.71 164.16,477.73 256,496" fill="#000000" fill-opacity="0.14"/>
            <polygon points="337.17,452 256,496 347.84,477.73 425.71,425.71" fill="#000000" fill-opacity="0.26"/>
            <polygon points="452,337.17 425.71,425.71 477.73,347.84 496,256" fill="#000000" fill-opacity="0.20"/>
        </g>

        <!-- facet edges, all clear of the lettering -->
        <g fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2.5" stroke-linejoin="miter"
           stroke-linecap="round">
            <polygon points="174.83,60 337.17,60 452,174.83 452,337.17 337.17,452 174.83,452 60,337.17 60,174.83"/>
            <polyline
                    points="174.83,60 256,16 337.17,60 425.71,86.29 452,174.83 496,256 452,337.17 425.71,425.71 337.17,452 256,496 174.83,452 86.29,425.71 60,337.17 16,256 60,174.83 86.29,86.29 174.83,60"/>
            <polygon
                    points="496,256 477.73,164.16 425.71,86.29 347.84,34.27 256,16 164.16,34.27 86.29,86.29 34.27,164.16 16,256 34.27,347.84 86.29,425.71 164.16,477.73 256,496 347.84,477.73 425.71,425.71 477.73,347.84"
                    stroke-opacity="0.18"/>
        </g>

        <!-- lettering on the table -->
        <g transform="translate(256,256) scale(0.85) translate(-257,-263)">
            <g filter="url(#lift)">
                <!-- Q ring -->
                <polygon points="267,219.55 267,292.45 215.45,344 142.55,344 91,292.45 91,219.55 142.55,168 215.45,168"
                         fill="none" stroke="#ffffff" stroke-width="42" stroke-linejoin="miter"/>

                <!-- Q tail -->
                <line x1="231" y1="308" x2="289" y2="366" stroke="#ffffff" stroke-width="38" stroke-linecap="butt"/>

                <!-- ++ -->
                <g stroke="url(#accent)" stroke-width="20" stroke-linecap="square" fill="none">
                    <line x1="330" y1="230" x2="330" y2="282"/>
                    <line x1="304" y1="256" x2="356" y2="256"/>
                    <line x1="408" y1="230" x2="408" y2="282"/>
                    <line x1="382" y1="256" x2="434" y2="256"/>
                </g>
            </g>
        </g>
    </g>
</svg>
